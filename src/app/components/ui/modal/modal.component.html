<!-- Modal Backdrop -->
<div *ngIf="isOpen" 
     class="fixed inset-0 z-50 overflow-y-auto"
     (click)="onBackdropClick()">
  
  <!-- Background Overlay -->
  <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"></div>
  
  <!-- Modal Container -->
  <div class="flex items-center justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
    
    <!-- This element is to trick the browser into centering the modal contents. -->
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    
    <!-- Modal Panel -->
    <div class="relative inline-block align-bottom bg-white rounded-lg px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:p-6 w-full"
         [class]="modalSizeClasses"
         (click)="onModalClick($event)">
      
      <!-- Modal Header -->
      <div *ngIf="showHeader" class="flex items-center justify-between mb-4">
        <h3 *ngIf="title" class="text-lg font-semibold text-gray-900">
          {{ title }}
        </h3>
        <ng-content select="[slot=header]"></ng-content>
        
        <button *ngIf="closable"
                type="button"
                (click)="close()"
                class="ml-auto text-gray-400 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-md p-1">
          <span class="sr-only">Close</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      
      <!-- Modal Body -->
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
      
      <!-- Modal Footer -->
      <div *ngIf="showFooter" class="mt-6 pt-4 border-t border-gray-200">
        <ng-content select="[slot=footer]"></ng-content>
      </div>
    </div>
  </div>
</div>
