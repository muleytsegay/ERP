<!-- Authenticated layout -->
<div
  *ngIf="isAuthenticated()"
  class="app-container"
  [class.collapsed]="isCollapsed"
>
  <!-- Topbar -->
  <app-topbar></app-topbar>

  <div class="layout-body">
    <!-- Sidebar -->
    <div class="sidebar" [class.collapsed]="isCollapsed">
      <!-- Collapse Toggle Button -->
      <div class="toggle-btn" (click)="toggleSidebar()">
        <i
          class="pi"
          [ngClass]="isCollapsed ? 'pi-angle-right' : 'pi-angle-left'"
        ></i>
      </div>

      <!-- Sidebar Menu -->
      <ul class="menu">
        <li class="menu-item" routerLink="/dashboard" routerLinkActive="active">
          <i class="pi pi-home"></i>
          <span *ngIf="!isCollapsed">Dashboard</span>
        </li>
        <li class="menu-item" routerLink="/employees" routerLinkActive="active">
          <i class="pi pi-users"></i>
          <span *ngIf="!isCollapsed">Employees</span>
        </li>
        <li
          class="menu-item"
          routerLink="/departments"
          routerLinkActive="active"
        >
          <i class="pi pi-building"></i>
          <span *ngIf="!isCollapsed">Departments</span>
        </li>
        <li
          class="menu-item"
          routerLink="/attendance"
          routerLinkActive="active"
        >
          <i class="pi pi-calendar"></i>
          <span *ngIf="!isCollapsed">Attendance</span>
        </li>
        <li class="menu-item" routerLink="/payroll" routerLinkActive="active">
          <i class="pi pi-wallet"></i>
          <span *ngIf="!isCollapsed">Payroll</span>
        </li>
      </ul>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Unauthenticated layout -->
<div *ngIf="!isAuthenticated()" class="unauth-container">
  <router-outlet></router-outlet>
</div>
