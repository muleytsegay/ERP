<!-- Loading state -->
<div *ngIf="isLoading" class="loading-container">
  <div class="loading-content">
    <i class="pi pi-spinner pi-spin" style="font-size: 2rem"></i>
    <p>Loading...</p>
  </div>
</div>

<!-- Authenticated layout -->
<div
  *ngIf="!isLoading && isAuthenticated()"
  class="app-container"
  [class.collapsed]="isCollapsed"
>
  <!-- Topbar -->
  <app-topbar></app-topbar>

  <div class="layout-body">
    <!-- Sidebar -->
    <div class="sidebar" [class.collapsed]="isCollapsed">
      <!-- Collapse Toggle Button -->
      <div class="toggle-btn" (click)="toggleSidebar()">
        <i
          class="pi"
          [ngClass]="isCollapsed ? 'pi-angle-right' : 'pi-angle-left'"
        ></i>
      </div>

      <!-- Use the SidabarComponent for role-based menu -->
      <app-sidabar></app-sidabar>
    </div>

    <!-- Main Content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Unauthenticated layout -->
<div *ngIf="!isLoading && !isAuthenticated()" class="unauth-container">
  <router-outlet></router-outlet>
</div>
