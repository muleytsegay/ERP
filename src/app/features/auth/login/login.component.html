<div class="surface-0 flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden p-3">
    <p-card class="flex justify-content-center align-items-center" [style]="{width: '360px'}">
    <ng-template pTemplate="header">
      <div class="text-center py-4">
        <h2 class="text-3xl font-bold text-primary mb-2">Welcome Back</h2>
        <p class="text-600 m-0">Sign in to your ERP account</p>
      </div>
    </ng-template>

    <ng-template pTemplate="content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="p-4">
        <!-- email Field -->
        <div class="field mb-4">
          <label for="email" class="block text-900 font-medium mb-2">email</label>
          <input 
            pInputText 
            id="email" 
            type="email" 
            placeholder="Enter your email" 
            formControlName="email"
            class="w-full p-3" 
            [class.ng-invalid]="f['email'].invalid && f['email'].touched" 
            autocomplete="email"
            />
          <small *ngIf="f['email'].invalid && f['email'].touched" class="p-error block mt-1">
            email is required
          </small>
        </div>

        <!-- Password Field -->
        <div class="field mb-4">
          <label for="password" class="block text-900 font-medium mb-2">Password</label>
          <p-password 
            id="password" 
            formControlName="password" 
            placeholder="Enter your password" 
            [toggleMask]="true" 
            class="w-full"
            inputStyleClass="w-full p-3"
            [feedback]="false"
            [class.ng-invalid]="f['password'].invalid && f['password'].touched"
            autocomplete="current-password">
          </p-password>
          <small *ngIf="f['password'].invalid && f['password'].touched" class="p-error block mt-1">
            <div *ngIf="f['password'].errors?.['required']">Password is required</div>
            <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 6 characters</div>
          </small>
        </div>

        <!-- Error Message -->
        <p-message 
          *ngIf="error" 
          severity="error" 
          [text]="error" 
          styleClass="w-full mb-4">
        </p-message>

        <!-- Submit Button -->
        <p-button 
          type="submit" 
          label="Sign In" 
          icon="pi pi-sign-in"
          [loading]="loading"
          [disabled]="loginForm.invalid"
          styleClass="w-full p-3 text-xl font-semibold">
        </p-button>

        <!-- Register Link -->
        <div class="text-center mt-4">
          <span class="text-600">Don't have an account? </span>
          <a 
            routerLink="/auth/register" 
            class="text-primary font-medium no-underline cursor-pointer hover:underline">
            Create one here
          </a>
        </div>
      </form>
    </ng-template>
  </p-card>
</div>
