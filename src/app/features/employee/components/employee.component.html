<div class="employee-container">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">Employee Management</h2>
    <button (click)="openAddModal()" class="btn btn-primary">Add Employee</button>
  </div>

  <div *ngIf="loading">Loading employees...</div>
  <div *ngIf="error" class="text-red-600">{{ error }}</div>

  <app-table
    *ngIf="employees.length > 0"
    [columns]="employeeColumns"
    [data]="employees"
    [loading]="loading"
    [actions]="employeeActions"
    [emptyMessage]="'No employees found.'">
  </app-table>

  <div *ngIf="!loading && employees.length === 0">No employees found.</div>

  <app-modal
    [isOpen]="showAddModal"
    title="Add Employee"
    (closeModal)="closeAddModal()">
    <div class="max-h-96 overflow-y-auto pr-2">
      <form (ngSubmit)="onAddEmployeeSubmit($event)">
        <app-alert *ngIf="error" type="error" [message]="error" [dismissible]="true" (closed)="error = ''"></app-alert>
        <div class="mb-4">
          <app-input label="First Name" [(ngModel)]="newEmployee.firstName" name="firstName" [required]="true"></app-input>
        </div>
        <div class="mb-4">
          <app-input label="Last Name" [(ngModel)]="newEmployee.lastName" name="lastName" [required]="true"></app-input>
        </div>
        <div class="mb-4">
          <app-input label="Email" type="email" [(ngModel)]="newEmployee.email" name="email" [required]="true"></app-input>
        </div>
        <div class="mb-4">
          <app-input label="Phone" type="tel" [(ngModel)]="newEmployee.phone" name="phone" [required]="true"></app-input>
        </div>
        <div class="mb-4">
          <app-input label="Address" [(ngModel)]="newEmployee.address" name="address" [required]="true"></app-input>
        </div>
        <div class="mb-4">
          <app-dropdown label="Department" [options]="departmentOptions" [(ngModel)]="newEmployee.departmentId" name="departmentId" [required]="true"></app-dropdown>
        </div>
        <div class="mb-4">
          <app-dropdown label="Position" [options]="positionOptions" [(ngModel)]="newEmployee.positionId" name="positionId" [required]="true"></app-dropdown>
        </div>
        <div class="mb-4">
          <app-input label="Hire Date" type="date" [(ngModel)]="newEmployee.hireDate" name="hireDate" [required]="true"></app-input>
        </div>
        <div class="mb-4">
          <app-input label="Salary" type="number" [(ngModel)]="newEmployee.salary" name="salary" [required]="true"></app-input>
        </div>
      </form>
    </div>
    <div class="flex justify-end space-x-2 mt-4 pt-4 border-t">
      <app-button label="Cancel" (onClick)="closeAddModal()" variant="outline"></app-button>
      <app-button label="Save" [loading]="loading" (onClick)="onAddEmployeeSubmit($event)"></app-button>
    </div>
  </app-modal>
</div>
