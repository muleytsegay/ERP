<!-- src/app/features/payroll/components/filter/payroll-filter.component.html -->
<div class="mainbar">
  <span class="filter-label">Payroll Period</span>
  <div class="toolbar">
    <!-- Dropdown for selecting payroll period -->
    <p-dropdown
      [options]="periods"
      [(ngModel)]="selected"
      optionLabel="label"
      placeholder="Select period"
      (onChange)="periodChange()"
    ></p-dropdown>

    <div class="actions">
      <!-- Export payroll button -->
      <button
        title="export payroll"
        pButton
        type="button"
        label="Export Payroll"
        icon="pi pi-download"
        class="p-button-secondary custom-btn"
        (click)="onExport()"
      ></button>

      <!-- Generate reports button -->
      <button
        title="generate reports"
        pButton
        type="button"
        label="Generate Reports"
        icon="pi pi-file"
        (click)="onProcess()"
        class="p-button-secondary custom-btn"
      ></button>
    </div>
  </div>
</div>
