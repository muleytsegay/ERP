<div [class]="containerClasses">
  <div class="flex flex-col items-center space-y-2">
    
    <!-- Spinner Type -->
    <div *ngIf="type === 'spinner'" 
         [class]="loaderClasses" 
         class="animate-spin">
      <svg fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </div>

    <!-- Dots Type -->
    <div *ngIf="type === 'dots'" class="flex space-x-1">
      <div [class]="loaderClasses" class="bg-current rounded-full animate-pulse"></div>
      <div [class]="loaderClasses" class="bg-current rounded-full animate-pulse" style="animation-delay: 0.1s"></div>
      <div [class]="loaderClasses" class="bg-current rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
    </div>

    <!-- Pulse Type -->
    <div *ngIf="type === 'pulse'" 
         [class]="loaderClasses" 
         class="bg-current rounded-full animate-ping">
    </div>

    <!-- Loading Text -->
    <p *ngIf="text" class="text-sm font-medium" [class.text-white]="overlay">
      {{ text }}
    </p>
  </div>
</div>
