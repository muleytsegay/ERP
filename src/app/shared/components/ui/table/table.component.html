<div>
  <table class="p-table"
         [class.table-striped]="striped"
         [class.table-hover]="hover"
         [class.border]="bordered">
    
    <!-- Table Header -->
  <thead>
      <tr>
        <!-- Selection Column -->
  <th *ngIf="selectable">
          <input type="checkbox" 
                 [checked]="allSelected"
                 [indeterminate]="indeterminate"
                 (change)="onSelectAll($any($event.target).checked)"
                 class="p-checkbox">
        </th>
        
        <!-- Data Columns -->
        <th *ngFor="let column of columns"
            class="p-column-title"
            [class]="'text-' + (column.align || 'left')"
            [style.width]="column.width">
          
          <div class="p-d-flex p-ai-center"
               [class.cursor-pointer]="column.sortable"
               (click)="onSort(column)">
            <span>{{ column.label }}</span>
            
            <!-- Sort Icons -->
            <div *ngIf="column.sortable" class="p-d-flex p-flex-column">
              <svg class="p-icon"
                   [class.text-indigo-600]="sortColumn === column.key && sortDirection === 'asc'"
                   fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd" />
              </svg>
              <svg class="p-icon"
                   [class.text-indigo-600]="sortColumn === column.key && sortDirection === 'desc'"
                   fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </div>
          </div>
        </th>
        
        <!-- Actions Column -->
  <th *ngIf="actions.length > 0" class="p-column-title p-text-right">
          Actions
        </th>
      </tr>
    </thead>
    
    <!-- Table Body -->
  <tbody>
      <!-- Loading State -->
      <tr *ngIf="loading">
        <td [attr.colspan]="columns.length + (selectable ? 1 : 0) + (actions.length > 0 ? 1 : 0)" 
            class="p-text-center">
          <div class="p-d-flex p-ai-center p-jc-center">
            <svg class="p-icon" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Loading...</span>
          </div>
        </td>
      </tr>
      
      <!-- Empty State -->
      <tr *ngIf="!loading && data.length === 0">
        <td [attr.colspan]="columns.length + (selectable ? 1 : 0) + (actions.length > 0 ? 1 : 0)" 
            class="p-text-center">
          {{ emptyMessage }}
        </td>
      </tr>
      
      <!-- Data Rows -->
      <tr *ngFor="let row of data; trackBy: trackByFn; let i = index"
          class="p-transition-colors"
          [class.hover:bg-gray-50]="hover"
          [class.bg-gray-50]="striped && i % 2 === 1"
          [class.bg-indigo-50]="isSelected(row)"
          (click)="onRowClick(row)">
        
        <!-- Selection Cell -->
  <td *ngIf="selectable">
          <input type="checkbox" 
                 [checked]="isSelected(row)"
                 (change)="onRowSelect(row, $any($event.target).checked)"
                 (click)="$event.stopPropagation()"
                 class="p-checkbox">
        </td>
        
        <!-- Data Cells -->
        <td *ngFor="let column of columns" 
            class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"
            [class]="'text-' + (column.align || 'left')">
          <ng-container [ngSwitch]="column.key">
            <!-- Custom content projection -->
            <ng-content [select]="'[slot=' + column.key + ']'"></ng-content>
            <!-- Default content -->
            <span *ngSwitchDefault>{{ getValue(row, column.key) }}</span>
          </ng-container>
        </td>
        
        <!-- Actions Cell -->
        <td *ngIf="actions.length > 0" class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <div class="flex items-center justify-end space-x-2">
            <ng-container *ngFor="let action of actions">
              <button *ngIf="shouldShowAction(action, row)"
                      (click)="action.action(row); $event.stopPropagation()"
                      [class]="action.class || 'text-indigo-600 hover:text-indigo-900'"
                      class="inline-flex items-center px-2 py-1 text-sm font-medium rounded-md transition-colors duration-200">
                <span *ngIf="action.icon" [innerHTML]="action.icon" class="mr-1"></span>
                {{ action.label }}
              </button>
            </ng-container>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
