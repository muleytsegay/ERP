<!-- Navigation Menu -->
<nav class="navigation-menu">
  <ul class="nav-list">
    <li *ngFor="let item of menuItems" class="nav-item">
      <a [routerLink]="item.routerLink" 
         routerLinkActive="active"
         class="nav-link">
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    </li>
  </ul>
</nav>
